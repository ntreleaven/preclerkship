<svg xmlns="http://www.w3.org/2000/svg" width="435" height="892" viewBox="0 0 435 892" role="img" aria-labelledby="t"><title id="t">Patient with suicidal ideation: assess risk and protective factors, then admit when there are red flags and no adequate safety net, otherwise manage as an outpatient with a safety plan, with ongoing monitoring either way</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
