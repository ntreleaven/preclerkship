<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="1274" viewBox="0 0 1052 1274" role="img" aria-labelledby="t"><title id="t">Approach to low mood: safety first, then rule out bipolar disorder and substance or medical causes, sort major from persistent depressive disorder, and treat with an SSRI plus psychotherapy or ECT when indicated</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M272.0 52.0L272.0 88.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M272.0 168.0L272.0 184.0L153.5 184.0L153.5 234.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M272.0 168.0L272.0 184.0L390.5 184.0L390.5 234.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M390.5 296.0L390.5 312.0L234.1 312.0L234.1 362.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
