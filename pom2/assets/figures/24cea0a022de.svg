<path d="M797.0 698.0L797.0 714.0L921.5 714.0L921.5 764.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M418.0 826.0L418.0 844.0L306.6 844.0L306.6 894.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M418.0 826.0L418.0 844.0L530.1 844.0L530.1 894.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M530.1 974.0L530.1 1010.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
