<rect x="143.0" y="10.0" width="760.0" height="60.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="523.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Which modality best RESOLVES the object of interest?</text>
<text x="523.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">SPATIAL: tell apart nearby objects · CONTRAST: tell apart objects of similar density · TEMPORAL: see change over time</text>
<rect x="45.0" y="120.0" width="552.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="321.0" y="145.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">X-RAY BASED</text>
<text x="321.0" y="165.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">differential attenuation of X-rays · radiation</text>
<rect x="637.0" y="120.0" width="364.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="819.0" y="145.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">NO IONIZING RADIATION</text>
<text x="819.0" y="165.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">sound · protons in a magnetic field</text>
<rect x="45.0" y="260.0" width="176.0" height="96.0" rx="10" fill="#46607a" stroke="#46607a" stroke-width="1.5"/>
<text x="133.0" y="303.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Radiography</text>
<text x="133.0" y="323.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">plain X-ray</text>
<rect x="233.0" y="260.0" width="176.0" height="96.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="321.0" y="303.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Fluoroscopy</text>
<text x="321.0" y="323.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">pulsed X-rays, real time</text>
<rect x="421.0" y="260.0" width="176.0" height="96.0" rx="10" fill="#1f5f9e" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="509.0" y="302.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Computed</text>
<text x="509.0" y="322.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">tomography (CT)</text>
<rect x="637.0" y="260.0" width="176.0" height="96.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="725.0" y="285.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Ultrasound</text>
<text x="725.0" y="305.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">grayscale: time to echo ·</text>
<text x="725.0" y="323.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">Doppler: frequency shift</text>
<text x="725.0" y="341.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">off a moving reflector</text>
<rect x="825.0" y="260.0" width="176.0" height="96.0" rx="10" fill="#6a4aa8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="913.0" y="294.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">MRI</text>
<text x="913.0" y="314.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">proton energy states ·</text>
<text x="913.0" y="332.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">choose the sequence</text>
