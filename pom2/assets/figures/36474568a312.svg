<text x="133.0" y="449.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#46607a" text-anchor="middle">SPATIAL +++</text>
<text x="55.0" y="469.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• contrast +</text>
<text x="55.0" y="487.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• temporal: none</text>
<rect x="233.0" y="396.0" width="176.0" height="134.0" rx="10" fill="#fbe8d3" stroke="#b5600f" stroke-width="1.5"/>
<text x="321.0" y="449.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">TEMPORAL +++</text>
<text x="243.0" y="469.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• spatial ++</text>
<text x="243.0" y="487.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• contrast +</text>
<rect x="421.0" y="396.0" width="176.0" height="134.0" rx="10" fill="#dde9f7" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="509.0" y="421.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Spatial ++ · contrast</text>
<text x="509.0" y="441.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">++</text>
<text x="431.0" y="461.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• temporal: none, or + with</text>
<text x="438.8" y="479.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">multi-phase scanning</text>
<text x="431.0" y="497.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• contrast dye → better</text>
<text x="438.8" y="515.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">contrast resolution</text>
<rect x="637.0" y="396.0" width="176.0" height="134.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="725.0" y="449.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">TEMPORAL +++</text>
<text x="647.0" y="469.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• contrast ++</text>
<text x="647.0" y="487.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• spatial +</text>
<rect x="825.0" y="396.0" width="176.0" height="134.0" rx="10" fill="#ebe4f7" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="913.0" y="449.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">CONTRAST +++</text>
<text x="835.0" y="469.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• spatial ++</text>
<text x="835.0" y="487.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• temporal 0/+</text>
<rect x="45.0" y="570.0" width="176.0" height="96.0" rx="10" fill="#ffffff" stroke="#46607a" stroke-width="1.5"/>
<text x="133.0" y="613.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#46607a" text-anchor="middle">Inexpensive · instant</text>
<text x="133.0" y="633.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">universally available</text>
<rect x="233.0" y="570.0" width="176.0" height="96.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="321.0" y="595.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Real-time video</text>
<text x="243.0" y="615.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• digital subtraction: only</text>
<text x="250.8" y="633.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">NEW things show</text>
<text x="250.8" y="651.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">(contrast, air)</text>
<rect x="421.0" y="570.0" width="176.0" height="96.0" rx="10" fill="#ffffff" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="509.0" y="612.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Widespread</text>
<text x="509.0" y="632.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">availability</text>
<rect x="637.0" y="570.0" width="176.0" height="96.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="725.0" y="604.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">No radiation</text>
<text x="647.0" y="624.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• widely available ·</text>
<text x="654.8" y="642.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">inexpensive</text>
<rect x="825.0" y="570.0" width="176.0" height="96.0" rx="10" fill="#ffffff" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="913.0" y="612.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Best contrast</text>
<text x="913.0" y="632.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">resolution</text>
<rect x="45.0" y="706.0" width="176.0" height="80.0" rx="10" fill="#ffffff" stroke="#46607a" stroke-width="1.5"/>
<text x="133.0" y="731.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#46607a" text-anchor="middle">No temporal</text>
<text x="133.0" y="751.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#46607a" text-anchor="middle">information</text>
<text x="133.0" y="771.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">contrast only +</text>
<rect x="233.0" y="706.0" width="176.0" height="80.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="321.0" y="741.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Limited availability</text>
<text x="243.0" y="761.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• invasive (angiography)</text>
<rect x="421.0" y="706.0" width="176.0" height="80.0" rx="10" fill="#ffffff" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="509.0" y="741.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Radiation dose</text>
<text x="431.0" y="761.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• moderate expense</text>
<rect x="637.0" y="706.0" width="176.0" height="80.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="725.0" y="750.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Least spatial detail</text>
<rect x="825.0" y="706.0" width="176.0" height="80.0" rx="10" fill="#ffffff" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="913.0" y="731.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Expensive · limited</text>
<text x="913.0" y="751.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">availability</text>
<text x="835.0" y="771.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• long scan</text>
