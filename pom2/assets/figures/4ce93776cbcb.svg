<text x="0" y="0" transform="translate(23 632.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">THEN</text>
