<svg xmlns="http://www.w3.org/2000/svg" width="1234" height="716" viewBox="0 0 1234 716" role="img" aria-labelledby="t"><title id="t">Neuropathic pain has a neurological cause and is recognized by its descriptors; after the cause is evaluated, one agent is chosen by the co-existing problem (amitriptyline for poor sleep or low cost, duloxetine for depression, carbamazepine for trigeminal neuralgia, gabapentinoids, topicals) with narcotics only as a last resort, and titrated by trial and error</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
