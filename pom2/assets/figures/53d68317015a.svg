<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="692" viewBox="0 0 1100 692" role="img" aria-labelledby="t"><title id="t">Telling the psychotic disorders apart: exclude substance and medical causes, place the psychosis against mood episodes, then separate delusional disorder and sort the rest by duration</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M316.6 52.0L316.6 88.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M316.6 150.0L316.6 166.0L201.9 166.0L201.9 216.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
