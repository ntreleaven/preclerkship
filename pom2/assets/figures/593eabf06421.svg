<svg xmlns="http://www.w3.org/2000/svg" width="1068" height="960" viewBox="0 0 1068 960" role="img" aria-labelledby="t"><title id="t">Suspected brain tumour: progressive symptoms and raised intracranial pressure prompt a contrast MRI; metastasis is treated by resection and radiation, a glioma by its grade (an enhancing high-grade glioma is treated at once, a non-enhancing low-grade glioma can be watched), and primary CNS lymphoma is suspected in the immunosuppressed</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<rect x="40" y="424" width="246" height="522" rx="16" fill="#eef7fa" stroke="#1f6f8b" stroke-opacity="0.25"/>
<rect x="316" y="424" width="246" height="522" rx="16" fill="#fdf4ea" stroke="#b5600f" stroke-opacity="0.25"/>
<rect x="564" y="424" width="246" height="522" rx="16" fill="#eff5fc" stroke="#1f5f9e" stroke-opacity="0.25"/>
<rect x="812" y="424" width="246" height="522" rx="16" fill="#f5f1fb" stroke="#6a4aa8" stroke-opacity="0.25"/>
<path d="M33 550H29V646H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 598.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">CLUES</text>
<path d="M33 686H29V938H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 812.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">TREATMENT</text>
<path d="M935.0 252.0L935.0 430.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M935.0 646.0L935.0 684.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M935.0 510.0L935.0 548.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M687.0 352.0L687.0 430.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M687.0 646.0L687.0 684.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M687.0 510.0L687.0 548.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M439.0 352.0L439.0 430.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M439.0 646.0L439.0 684.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M439.0 510.0L439.0 548.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
