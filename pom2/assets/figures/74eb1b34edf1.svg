<svg xmlns="http://www.w3.org/2000/svg" width="548" height="410" viewBox="0 0 548 410" role="img" aria-labelledby="t"><title id="t">Localizing visual field loss: one eye means the optic nerve on that side, both outer halves the optic chiasm, the same side in both eyes the opposite optic tract</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
