<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1032" viewBox="0 0 520 1032" role="img" aria-labelledby="t"><title id="t">Ontario Mental Health Act forms: Form 2 from a justice of the peace, Form 1 for a 72-hour assessment, Form 3 involuntary admission for 14 days, Form 4 renewal</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
