<svg xmlns="http://www.w3.org/2000/svg" width="739" height="722" viewBox="0 0 739 722" role="img" aria-labelledby="t"><title id="t">Low mood in a medically ill patient: screen, exclude hypoactive delirium, then separate major depression from an adjustment disorder</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M247.0 52.0L247.0 88.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M247.0 132.0L247.0 168.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M247.0 230.0L247.0 246.0L123.5 246.0L123.5 296.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M247.0 230.0L247.0 246.0L370.5 246.0L370.5 296.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
