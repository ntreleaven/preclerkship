<svg xmlns="http://www.w3.org/2000/svg" width="641" height="980" viewBox="0 0 641 980" role="img" aria-labelledby="t"><title id="t">Managing new behaviour in dementia: describe, investigate causes, create a plan with non-drug approaches first, add a low-risk or high-risk drug only when needed, then evaluate</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M362.5 70.0L362.5 106.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
