<svg xmlns="http://www.w3.org/2000/svg" width="829" height="1262" viewBox="0 0 829 1262" role="img" aria-labelledby="t"><title id="t">How a child moves through the Children's Aid Society: voluntary involvement, supervision order or protection application, temporary care and custody, then return home, Crown wardship or adoption</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M396.1 52.0L396.1 106.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
