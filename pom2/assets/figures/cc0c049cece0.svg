<svg xmlns="http://www.w3.org/2000/svg" width="944" height="644" viewBox="0 0 944 644" role="img" aria-labelledby="t"><title id="t">Child with persistent disruptive behaviour: serious rule-breaking means conduct disorder (antisocial personality disorder from 18); defiance means oppositional defiant disorder, or disruptive mood dysregulation disorder with severe outbursts</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
