<svg xmlns="http://www.w3.org/2000/svg" width="727" height="1262" viewBox="0 0 727 1262" role="img" aria-labelledby="t"><title id="t">Approach to ADHD: history from several sources and rating scales, check the criteria and the mimics, then psychoeducation and a long-acting stimulant first, a non-stimulant second, off-label options third</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M204.5 90.0L204.5 126.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
