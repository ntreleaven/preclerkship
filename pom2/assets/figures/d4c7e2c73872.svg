<svg xmlns="http://www.w3.org/2000/svg" width="574" height="998" viewBox="0 0 574 998" role="img" aria-labelledby="t"><title id="t">Workup of a cognitive concern: collateral history, medication review, exam, cognitive screen and labs, then treat a reversible cause or separate mild from major neurocognitive disorder by independence</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M205.2 70.0L205.2 106.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M205.2 222.0L205.2 258.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M205.2 320.0L205.2 356.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M205.2 400.0L205.2 436.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M205.2 498.0L205.2 534.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M205.2 614.0L205.2 650.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M205.2 730.0L205.2 746.0L100.5 746.0L100.5 796.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M205.2 730.0L205.2 746.0L310.0 746.0L310.0 796.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
