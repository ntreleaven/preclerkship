<svg xmlns="http://www.w3.org/2000/svg" width="368" height="998" viewBox="0 0 368 998" role="img" aria-labelledby="t"><title id="t">Suspected eating disorder: outpatient care unless an admission criterion is met, then nutritional rehabilitation with refeeding-risk monitoring and gradual weight restoration</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M233.4 52.0L233.4 88.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M233.4 150.0L233.4 186.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M233.4 230.0L233.4 246.0L156.7 246.0L156.7 296.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M233.4 230.0L233.4 246.0L310.2 246.0L310.2 404.0L233.4 404.0L233.4 454.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
