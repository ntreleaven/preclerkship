<svg xmlns="http://www.w3.org/2000/svg" width="662" height="810" viewBox="0 0 662 810" role="img" aria-labelledby="t"><title id="t">Abnormal mood in pregnancy or after delivery: psychotic features mean postpartum psychosis, an emergency; a mild self-limited dip is postpartum blues; a depressive episode is peripartum depression, watching for a bipolar switch</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
