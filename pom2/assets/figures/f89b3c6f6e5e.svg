<svg xmlns="http://www.w3.org/2000/svg" width="756" height="712" viewBox="0 0 756 712" role="img" aria-labelledby="t"><title id="t">Capacity to consent to treatment: a patient who cannot understand or appreciate is incapable, and then the substitute decision-maker decides unless it is an emergency</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
