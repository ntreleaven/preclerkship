<path d="M356.3 150.0L356.3 166.0L251.0 166.0L251.0 294.0L320.0 294.0L320.0 356.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M356.3 150.0L356.3 166.0L461.5 166.0L461.5 216.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M320.0 436.0L320.0 472.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
