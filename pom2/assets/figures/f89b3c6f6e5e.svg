<path d="M461.5 278.0L461.5 306.0L603.0 306.0L603.0 356.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M320.0 554.0L320.0 570.0L168.9 570.0L168.9 620.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
