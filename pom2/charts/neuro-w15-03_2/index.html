<details class="orig"><summary>Compare with the chart as it is in the notes</summary><div class="paper"><svg xmlns="http://www.w3.org/2000/svg" width="1012" height="1173" viewBox="0 0 1012 1173" role="img" aria-labelledby="t"><title id="t">Tremor or slowness: a symmetric postural or action tremor that improves with alcohol is essential tremor; asymmetric rest tremor with rigidity, bradykinesia and postural instability is parkinsonism, which is Parkinson's disease only once drugs, basal ganglia lesions, head trauma, toxins, PSP and MSA are excluded; each with its treatment</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>

<rect x="141.0" y="10.0" width="760.0" height="78.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="521.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Tremor or slowness: WHEN is the tremor worst, and is it on ONE side?</text>
<text x="151.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="start">• hyperkinetic (too much movement): ballismus · chorea · athetosis · tremor · dystonia · tics</text>
<text x="151.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="start">• hypokinetic (too little): parkinsonism, with bradykinesia (slow) and akinesia (hard to start)</text>
<rect x="45.0" y="138.0" width="300.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="195.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Tremor with POSTURE or ACTION</text>
<text x="195.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">SYMMETRIC</text>
<rect x="385.0" y="138.0" width="612.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="691.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">PARKINSONISM: a syndrome</text>
<text x="691.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">tremor · rigidity · bradykinesia · postural instability, in any mix</text>
<rect x="45.0" y="278.0" width="300.0" height="78.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="195.0" y="312.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Essential tremor</text>
<text x="195.0" y="332.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">may be hereditary · worsens over time</text>
<rect x="385.0" y="278.0" width="300.0" height="78.0" rx="10" fill="#6a4aa8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="535.0" y="303.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Parkinson's disease</text>
<text x="535.0" y="323.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">dopamine neurons of the substantia nigra die ·</text>
<text x="535.0" y="341.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">onset about 60</text>
<rect x="697.0" y="278.0" width="300.0" height="78.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="847.0" y="312.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Parkinsonism from ANOTHER cause</text>
<text x="847.0" y="332.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">Parkinson's disease is only ONE cause</text>
<rect x="45.0" y="396.0" width="300.0" height="344.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="195.0" y="536.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Postural or action tremor</text>
<text x="55.0" y="556.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• both sides alike</text>
<text x="55.0" y="574.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• arms most, also head and voice</text>
<text x="55.0" y="592.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• improves with ALCOHOL</text>
<text x="55.0" y="610.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• LARGE, shaky handwriting</text>
<rect x="385.0" y="396.0" width="300.0" height="344.0" rx="10" fill="#ebe4f7" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="535.0" y="509.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">T.R.A.P., ASYMMETRIC</text>
<text x="395.0" y="529.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Tremor at REST, pill-rolling</text>
<text x="395.0" y="547.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Rigidity: same at any speed, ↑ with</text>
<text x="402.8" y="565.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">augmentation</text>
<text x="395.0" y="583.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Akinesia / bradykinesia</text>
<text x="395.0" y="601.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Postural instability</text>
<text x="395.0" y="619.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• small handwriting · masked face · soft voice ·</text>
<text x="402.8" y="637.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">less arm swing · stooped, turns en bloc</text>
<rect x="697.0" y="396.0" width="300.0" height="132.0" rx="10" fill="#fbe8d3" stroke="#b5600f" stroke-width="1.5"/>
<text x="847.0" y="421.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Ask about</text>
<text x="707.0" y="441.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• antipsychotics, antiemetics (prochlorperazine,</text>
<text x="714.8" y="459.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">metoclopramide)</text>
<text x="707.0" y="477.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• basal ganglia stroke, bleed, tumour, infection</text>
<text x="707.0" y="495.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• repeated head trauma · carbon monoxide,</text>
<text x="714.8" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">cyanide</text>
<rect x="697.0" y="550.0" width="145.0" height="190.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="769.5" y="575.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Progressive</text>
<text x="769.5" y="595.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">supranuclear</text>
<text x="769.5" y="615.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">palsy (PSP)</text>
<text x="707.0" y="635.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• VERTICAL gaze</text>
<text x="714.8" y="653.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">palsy, overcome by</text>
<text x="714.8" y="671.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">vestibular reflexes</text>
<text x="707.0" y="689.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• EARLY falls</text>
<text x="707.0" y="707.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• axial tone &gt; limb</text>
<text x="714.8" y="725.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">tone</text>
<rect x="852.0" y="550.0" width="145.0" height="190.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="924.5" y="585.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Multiple system</text>
<text x="924.5" y="605.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">atrophy (MSA)</text>
<text x="862.0" y="625.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• AUTONOMIC</text>
<text x="869.8" y="643.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">dysfunction</text>
<text x="862.0" y="661.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• + parkinsonism</text>
<text x="869.8" y="679.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">(MSA-P) OR</text>
<text x="869.8" y="697.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">cerebellar signs</text>
<text x="869.8" y="715.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">(MSA-C)</text>
<rect x="45.0" y="780.0" width="300.0" height="97.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="195.0" y="832.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Mild → no treatment</text>
<rect x="45.0" y="899.0" width="300.0" height="115.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="195.0" y="951.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Beta-blocker or primidone</text>
<text x="195.0" y="971.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">other anticonvulsants are options</text>
<rect x="45.0" y="1036.0" width="300.0" height="115.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="195.0" y="1088.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">Refractory → deep brain stimulation</text>
<text x="195.0" y="1108.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">targets in the basal ganglia</text>
<rect x="385.0" y="780.0" width="300.0" height="62.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="535.0" y="805.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Not functionally limiting → no</text>
<text x="535.0" y="825.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">treatment yet</text>
<rect x="385.0" y="864.0" width="300.0" height="150.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="535.0" y="889.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Limiting → LEVODOPA + carbidopa</text>
<text x="395.0" y="909.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• most effective: bradykinesia, rigidity best ·</text>
<text x="402.8" y="927.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">tremor variable</text>
<text x="395.0" y="945.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• start low, titrate slowly</text>
<text x="395.0" y="963.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• NEVER stop suddenly</text>
<text x="395.0" y="981.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• watch: on-off, wearing off · dyskinesia (50% by</text>
<text x="402.8" y="999.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">5 years)</text>
<rect x="385.0" y="1036.0" width="300.0" height="114.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="535.0" y="1061.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Other options</text>
<text x="395.0" y="1081.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• early: MAO-B inhibitor</text>
<text x="395.0" y="1099.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• dopamine agonist (pramipexole, ropinirole)</text>
<text x="395.0" y="1117.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• tremor: anticholinergic</text>
