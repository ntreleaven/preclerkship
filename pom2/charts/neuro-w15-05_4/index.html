<text x="620.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">cerebellar HEMISPHERE → limbs: over- or undershoots, clumsy · VERMIS → trunk: can't sit, wide-based gait</text>
